<style>
:root{
  --blue:#003b9b;
  --blue-dark:#002f7d;
  --blue-light:#0f5fff;
  --yellow:#ffd400;
  --green:#52d66b;
  --text:#1f2937;
  --muted:#6b7280;
  --bg:#f4f6fa;
  --white:#ffffff;
  --line:#e5e7eb;
  --shadow:0 8px 24px rgba(0,0,0,.07);
  --radius:16px;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}

.container{width:100%;max-width:1100px;margin:auto;padding:0 24px;}

/* ── HERO ── */
.hero{
  background:
    radial-gradient(circle at top right, rgba(255,255,255,.08), transparent 30%),
    linear-gradient(135deg, var(--blue-dark), var(--blue));
  color:#fff;
  padding:28px 0 26px;
}

.hero h1{
  font-size:clamp(1.5rem,3.8vw,2.2rem);
  font-weight:800;
  line-height:1.15;
  margin-bottom:4px;
  color:#fff;
}

.hero-sub{
  font-size:clamp(.88rem,2vw,1.05rem);
  font-weight:500;
  color:var(--green);
  font-size:clamp(1rem,2.4vw,1.2rem);
  margin-top:2px;
  letter-spacing:.01em;
}

.hero-bar{
  width:48px;height:4px;
  background:var(--yellow);
  border-radius:50px;
  margin-top:12px;
}

/* ── MAIN SECTION ── */
.section{padding:44px 0 60px;}

/* ── TOOLBAR ── */
.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.search-wrap{
  position:relative;
  flex:1;
  min-width:220px;
  max-width:380px;
}

.search-wrap i{
  position:absolute;
  left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:.9rem;
}

#searchInput{
  width:100%;
  height:44px;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:0 14px 0 38px;
  font-family:inherit;
  font-size:.95rem;
  color:var(--text);
  background:#fff;
  outline:none;
  transition:.2s;
}

#searchInput:focus{border-color:var(--blue);}

.count-badge{
  background:#eef3ff;
  color:var(--blue);
  border-radius:8px;
  padding:6px 14px;
  font-size:.9rem;
  font-weight:600;
  white-space:nowrap;
}

/* ── FILE TABLE ── */
.table-wrap{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead th{
  background:var(--blue);
  color:#fff;
  font-size:.85rem;
  font-weight:600;
  text-align:left;
  padding:13px 18px;
  white-space:nowrap;
}

thead th:last-child{text-align:center;width:130px;}

tbody tr{
  border-bottom:1px solid var(--line);
  transition:background .15s;
}

tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f7f9ff;}

td{
  padding:13px 18px;
  font-size:.92rem;
  vertical-align:middle;
}

.file-name{
  display:flex;
  align-items:center;
  gap:10px;
}

.file-icon{
  width:34px;height:34px;min-width:34px;
  border-radius:8px;
  background:#eef3ff;
  color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;
}

.file-label{font-weight:500;word-break:break-all;}

td.size{color:var(--muted);font-size:.85rem;white-space:nowrap;}
td.date{color:var(--muted);font-size:.85rem;white-space:nowrap;}

.btn-dl{
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:34px;
  padding:0 14px;
  background:var(--blue);
  color:#fff;
  border-radius:8px;
  text-decoration:none;
  cursor:pointer;
  font-size:.83rem;
  font-weight:700;
  transition:.2s;
  white-space:nowrap;
}

.btn-dl:hover{background:#0052d6;}

/* ── ESTADOS ── */
.state{
  text-align:center;
  padding:56px 24px;
  color:var(--muted);
}

.state i{font-size:2.2rem;margin-bottom:14px;display:block;color:#c0ccdd;}
.state p{font-size:1rem;}

/* ── FOOTER ── */
footer{
  background:linear-gradient(135deg,var(--blue-dark),var(--blue));
  padding:20px 0;
  margin-top:0;
}

.footer-brand{display:flex;align-items:center;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .toolbar{flex-direction:column;align-items:flex-start;}
  .search-wrap{max-width:100%;width:100%;}
  td.date{display:none;}
  thead th:nth-child(3){display:none;}
  td.size{display:none;}
  thead th:nth-child(2){display:none;}
}

@media(max-width:480px){
  .hero h1{font-size:1.2rem;}
  td{padding:11px 12px;}
  .btn-dl span{display:none;}
}
</style>
</head>

<body>

<!-- HERO -->
<header class="hero">
  <div class="container">
    <h1>Download de Dados</h1>
    <p class="hero-sub">Transferências Discricionárias e Legais</p>
    <div class="hero-bar"></div>
  </div>
</header>

<!-- CONTENT -->
<section class="section">
  <div class="container">

    <div class="toolbar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar arquivo..." oninput="filterFiles()">
      </div>
      <div class="count-badge" id="countBadge">Carregando…</div>
    </div>

    <div class="table-wrap">
      <div id="fileList">
        <div class="state">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <p>Buscando arquivos disponíveis…</p>
        </div>
      </div>
    </div>

  </div>
</section>
