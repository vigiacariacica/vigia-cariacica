name: Site

# Gera e testa o site público (vigiacariacica.github.io) com os dados do robô e guarda como artefato.
# Roda depois de cada coleta, quando muda o site ou um dado que ele mostra, e toda segunda (postos e escolas).
# A publicação é feita pelo próprio repositório vigiacariacica.github.io (workflow "Atualizar o site"), que lê
# este repositório público todo dia: não precisa de token nem de segredo aqui (docs/DECISOES.md, 24/11/2026).
on:
  workflow_run:
    workflows: [Coleta]
    types: [completed]
  push:
    branches: [main]
    paths: ["vigia/site/**", "vigia/pedidos.py", "data/pedidos/**", "data/fila/**", "data/raiox/**", "data/site/**",
            "data/resultados.csv", "data/equipamentos/**", "data/camara/**", "tests/test_site.py",
            ".github/workflows/site.yml"]
  schedule:
    - cron: "17 10 * * 1"   # segunda, 07:17 de Brasília: postos de saúde e escolas por bairro
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Postos de saúde e escolas por bairro (CNES e mapa do Estado)
        if: github.event_name != 'workflow_run'
        run: python -m vigia.coletores.equipamentos || echo "::warning::Equipamentos falhou; o site usa o arquivo anterior"

      - name: Guardar postos e escolas
        run: |
          git config user.name "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add data/equipamentos 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "dados: postos de saúde e escolas por bairro ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then break; fi
              sleep 15
            done
          fi

      - name: Testes do site (linguagem simples, dados pessoais, fontes)
        run: python -m pytest -q tests/test_site.py

      - name: Formulário de denúncia no ar bate com o site
        continue-on-error: true    # o Google fora do ar não pode parar o site; a diferença aparece como aviso
        run: python ferramentas/conferir_formulario.py

      - name: Gerar o site
        run: python -m vigia.site --saida _site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
